name: Generate Stats SVGs

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clone and install github-readme-stats
        run: |
          git clone --depth 1 https://github.com/anuraghazra/github-readme-stats.git /tmp/stats
          cd /tmp/stats
          npm install

      - name: Start server and generate SVGs
        env:
          PAT_1: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /tmp/stats
          node express.js &
          sleep 5

          mkdir -p $GITHUB_WORKSPACE/stats

          for user in mayerstrk GerritHillebrecht Tombunzel; do
            curl -sf -o "$GITHUB_WORKSPACE/stats/${user}-stats.svg" \
              "http://localhost:9000/api?username=${user}&show_icons=true&theme=tokyonight&hide_border=true&count_private=true"
            echo "Generated stats for ${user}"
          done

          kill %1

      - name: Commit and push SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats/
          if ! git diff --staged --quiet; then
            git commit -m "chore: update stats SVGs"
            git push
          fi
